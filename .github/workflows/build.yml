name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: client
            directory: .
          - name: authority
            directory: server
    defaults:
      run:
        working-directory: ${{ matrix.project.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository intentionally has no lockfile, so npm ci/cache are not reliable.
      - run: npm install --no-audit --no-fund
      - run: npm run build
